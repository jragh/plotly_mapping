# Railway / Nixpacks build configuration
# -----------------------------------------------------------------------------
# Phase order:  setup -> install -> build -> start
#   install : Nixpacks auto-installs requirements.txt into a venv on PATH
#   build   : regenerate the data artifacts so they are baked into the image
#   start   : serve the Dash app with gunicorn on Railway's $PORT
#
# `dependsOn = ["install"]` is REQUIRED: it guarantees the build step runs
# AFTER dependencies are installed and inherits the venv on PATH. Without it,
# Nixpacks may skip the custom build phase (or run it without polars/pandas),
# which silently leaves the previously-committed data in place — exactly the
# "stale data" bug where the percentage KPI cards showed NaN%.
#
# Building the data here (not at release/pre-deploy) is deliberate: files written
# during the build are baked into the image and visible to the web process.
# -----------------------------------------------------------------------------

[phases.build]
dependsOn = ["install"]
cmds = [
  "echo '===== [nixpacks] regenerating map data via build_data.py ====='",
  "python build_data.py",
  "echo '===== [nixpacks] data build complete ====='",
]

[start]
# app:server  -> the Flask server object exposed in app.py
cmd = "gunicorn app:server --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
